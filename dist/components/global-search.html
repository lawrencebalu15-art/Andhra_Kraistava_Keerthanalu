<div id="globalSearchModal" class="global-search">

    <div class="search-panel">

        <div class="search-header">

            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>

            <input
                id="globalSearchInput"
                type="search"
                placeholder="Search hymns, authors, books, interviews..."
                autocomplete="off">

            <button
                id="closeSearch"
                class="close-search"

        <div id="searchResults" class="search-results">

                <p>
                    Search hymns, authors, books, interviews and more.
                </p>

                <div class="popular-searches">

                    <span>Popular</span>

                    <button class="popular-chip">యేసు</button>

                    <button class="popular-chip">ప్రేమ</button>

                    <button class="popular-chip">Popley</button>

                    <button class="popular-chip">Hymn 27</button>

            </div>
