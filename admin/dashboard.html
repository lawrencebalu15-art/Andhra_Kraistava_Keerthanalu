<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Andhra Kraistava Keerthanalu CMS</title>

<link rel="stylesheet" href="/admin/css/admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside id="sidebar">

        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">

            <!-- Navbar -->
            <header id="navbar">

            </header>

            <!-- Dashboard Content -->
            <section class="dashboard-content">

                <div class="page-header">

                    <h1>
                        Dashboard
                    </h1>

                    <p>
                        Welcome back to Andhra Kraistava Keerthanalu CMS.
                    </p>

                </div>

                <div class="stats-grid">

                    <div class="stat-card">

                        <h3>Total Hymns</h3>

                        <h2 id="totalHymns">0</h2>

                    </div>

                    <div class="stat-card">

                        <h3>Authors</h3>

                        <h2 id="totalAuthors">0</h2>

                    </div>

                    <div class="stat-card">

                        <h3>Books</h3>

                        <h2 id="totalBooks">0</h2>

                    </div>


                    <div class="stat-card">

                        <h3>Categories</h3>

                        <h2 id="totalCategories">0</h2>

                    </div>

                </div>

                <div class="dashboard-card">

                    <h2>

                        Recent Hymns

                    </h2>

                    <div id="recentHymns">

                        Loading...

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script type="module" src="./js/common.js"></script>
    <script type="module" src="/admin/js/dashboard.js"></script>

</body>

</html>
